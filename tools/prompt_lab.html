<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Prompt Lab · Eresoth RTS 指挥链路调试</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 13px/1.5 "Microsoft YaHei", sans-serif; background: #14161a; color: #d8dce2; }
  header { display: flex; align-items: center; gap: 12px; padding: 8px 16px; background: #1c2027; border-bottom: 1px solid #2c313a; }
  header h1 { font-size: 15px; margin: 0; color: #7ec8ff; }
  header .cfg { color: #8a919c; font-size: 12px; }
  header .cfg b { color: #c8d0da; }
  button { background: #2b323d; color: #d8dce2; border: 1px solid #3d4552; border-radius: 4px; padding: 4px 10px; cursor: pointer; font-size: 12px; }
  button:hover { background: #374050; }
  button.primary { background: #1f6feb; border-color: #1f6feb; color: #fff; }
  button.primary:hover { background: #2a7bff; }
  button.danger { border-color: #7a3535; color: #ff9d9d; }
  button:disabled { opacity: .5; cursor: default; }
  select, input[type=text], textarea { background: #10131a; color: #d8dce2; border: 1px solid #3d4552; border-radius: 4px; padding: 4px 6px; font-size: 12px; }
  textarea { width: 100%; font-family: Consolas, "Courier New", monospace; resize: vertical; }
  nav { display: flex; gap: 4px; padding: 6px 16px 0; background: #1c2027; }
  nav button { border-radius: 6px 6px 0 0; border-bottom: none; padding: 6px 18px; }
  nav button.active { background: #14161a; color: #7ec8ff; border-color: #2c313a; }
  main { padding: 12px 16px; }
  .tab { display: none; }
  .tab.active { display: block; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
  .cols { display: flex; gap: 12px; align-items: flex-start; }
  .col { flex: 1; min-width: 0; }
  pre { background: #0d1015; border: 1px solid #262b33; border-radius: 4px; padding: 8px; overflow: auto; max-height: 420px; font: 11px/1.45 Consolas, monospace; white-space: pre-wrap; word-break: break-all; margin: 4px 0; }
  details { margin: 4px 0; }
  summary { cursor: pointer; color: #7ec8ff; font-size: 12px; }
  table { border-collapse: collapse; width: 100%; font-size: 12px; }
  th, td { border: 1px solid #2c313a; padding: 4px 6px; text-align: left; vertical-align: top; }
  th { background: #1c2027; color: #9aa3af; font-weight: normal; }
  tr.entry { cursor: pointer; }
  tr.entry:hover { background: #1d222b; }
  tr.entry.sel { background: #223048; }
  .ok { color: #6fdc8c; } .bad { color: #ff8a8a; } .warn { color: #ffcf7a; } .dim { color: #8a919c; }
  .pill { display: inline-block; padding: 0 6px; border-radius: 8px; font-size: 11px; background: #262b33; margin-right: 4px; }
  .editor-block { margin-bottom: 10px; }
  .editor-block .lbl { display: flex; justify-content: space-between; align-items: center; margin-bottom: 3px; }
  .editor-block .lbl b { color: #a8c7fa; }
  #modal-mask { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none; align-items: center; justify-content: center; z-index: 9; }
  #modal { background: #1c2027; border: 1px solid #3d4552; border-radius: 8px; padding: 16px; width: 460px; }
  #modal label { display: block; margin: 8px 0 2px; color: #9aa3af; }
  #modal input[type=text] { width: 100%; }
  .toast { position: fixed; bottom: 16px; right: 16px; background: #223a2a; border: 1px solid #3f6b4d; color: #9fe8b4; padding: 8px 14px; border-radius: 6px; display: none; z-index: 10; }
</style>
</head>
<body>
<header>
  <h1>Prompt Lab</h1>
  <span class="cfg" id="cfg-info">加载配置中…</span>
  <span style="flex:1"></span>
  <button onclick="openCfg()">⚙ 模型设置</button>
</header>
<nav>
  <button class="active" data-tab="logs" onclick="switchTab('logs')">📜 日志查看</button>
  <button data-tab="prompt" onclick="switchTab('prompt')">✏️ Prompt 调试</button>
  <button data-tab="batch" onclick="switchTab('batch')">🧪 批跑样例</button>
</nav>
<main>

<!-- ============ 日志查看 ============ -->
<div class="tab active" id="tab-logs">
  <div class="row">
    <select id="log-which">
      <option value="llm">llm_log.jsonl（发给模型 / 模型返回）</option>
      <option value="command">command_log.jsonl（指令 → 执行结果）</option>
    </select>
    <select id="log-n"><option value="100">最近 100 条</option><option value="300" selected>最近 300 条</option><option value="0">全部</option></select>
    <button onclick="loadLogs()">刷新</button>
    <span class="dim" id="log-path"></span>
  </div>
  <div class="cols">
    <div class="col" style="max-width:46%">
      <table><thead><tr><th style="width:130px">时间</th><th>摘要</th><th style="width:60px">耗时</th><th style="width:70px">token</th></tr></thead>
      <tbody id="log-list"></tbody></table>
    </div>
    <div class="col" id="log-detail"><span class="dim">← 点击左侧条目查看完整现场</span></div>
  </div>
</div>

<!-- ============ Prompt 调试 ============ -->
<div class="tab" id="tab-prompt">
  <div class="cols">
    <div class="col">
      <div class="row"><b style="color:#a8c7fa">Prompt 文件</b><span class="dim">保存后游戏内下一条指令即生效（热重载）</span>
        <span style="flex:1"></span><button class="primary" onclick="saveAllPrompts()">全部保存</button></div>
      <div id="prompt-editors"></div>
    </div>
    <div class="col">
      <div class="row"><b style="color:#a8c7fa">试跑</b></div>
      <div class="row">
        <label class="dim">态势 digest：</label>
        <select id="digest-src" onchange="onDigestSrc()">
          <option value="@sample">示例样例（tools/sample_digest.json）</option>
          <option value="@command_log_latest">command_log 最新一条的态势</option>
          <option value="custom">手动粘贴 / 编辑</option>
        </select>
      </div>
      <textarea id="digest-text" rows="8" readonly></textarea>
      <div class="row" style="margin-top:6px"><label class="dim">对话历史（可空）：</label></div>
      <textarea id="history-text" rows="2" placeholder="玩家：…&#10;参谋：…"></textarea>
      <div class="row" style="margin-top:6px">
        <input type="text" id="player-text" style="flex:1" placeholder="玩家命令，如：二军团去东矿，遇到主力就撤">
        <button class="primary" id="btn-run" onclick="runOnce()">发送</button>
      </div>
      <div id="run-result"></div>
    </div>
  </div>
</div>

<!-- ============ 批跑样例 ============ -->
<div class="tab" id="tab-batch">
  <div class="row">
    <button class="primary" id="btn-batch" onclick="runBatch()">▶ 全部运行</button>
    <button onclick="addCase()">＋ 新增样例</button>
    <button onclick="saveCases()">💾 保存样例</button>
    <button onclick="exportResults()">导出结果 jsonl</button>
    <span class="dim" id="batch-progress"></span>
  </div>
  <table><thead><tr>
    <th style="width:110px">名称</th><th>玩家命令</th><th style="width:150px">digest 来源</th><th style="width:200px">期望 / 备注</th><th style="width:110px">操作</th>
  </tr></thead><tbody id="case-list"></tbody></table>
  <h3 style="color:#a8c7fa;margin:14px 0 6px">运行结果</h3>
  <div id="batch-results"><span class="dim">尚未运行</span></div>
</div>

</main>

<!-- 设置弹窗 -->
<div id="modal-mask">
  <div id="modal">
    <b style="color:#a8c7fa">模型设置</b> <span class="dim">（写入 EresothRTS/llm_config.json，游戏与调试共用）</span>
    <label>base_url</label><input type="text" id="cfg-base">
    <label>model</label><input type="text" id="cfg-model">
    <label>api_key（留空 = 保持不变）</label><input type="text" id="cfg-key" placeholder="">
    <label><input type="checkbox" id="cfg-thinking"> 推理模型（thinking）模式</label>
    <div class="row" style="margin-top:12px;justify-content:flex-end">
      <button onclick="closeCfg()">取消</button>
      <button class="primary" onclick="saveCfg()">保存</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
"use strict";
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
async function api(path, method, body) {
  const opt = { method: method || "GET" };
  if (body !== undefined) { opt.headers = {"Content-Type":"application/json"}; opt.body = JSON.stringify(body); }
  let r;
  try { r = await fetch(path, opt); }
  catch (e) { throw new Error("连接服务器失败（prompt_lab.py 是否在运行？）"); }
  let j;
  try { j = await r.json(); }
  catch (e) { throw new Error(`服务器返回异常（HTTP ${r.status}）`); }
  if (!r.ok) throw new Error(j.error || `HTTP ${r.status}`);
  return j;
}
function toast(msg) { const t = $("toast"); t.textContent = msg; t.style.display = "block"; setTimeout(()=>t.style.display="none", 2200); }
function pretty(s) { try { return JSON.stringify(typeof s === "string" ? JSON.parse(s) : s, null, 2); } catch { return s; } }
function stripFence(s) {
  if (!s) return s;
  s = s.trim();
  if (s.startsWith("```")) { const i = s.indexOf("\n"); if (i > 0) s = s.slice(i+1); const j = s.lastIndexOf("```"); if (j > 0) s = s.slice(0, j); }
  return s.trim();
}
function tryJson(s) { try { return JSON.parse(stripFence(s)); } catch { return null; } }

function switchTab(name) {
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("active", b.dataset.tab === name));
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t.id === "tab-" + name));
  if (name === "logs" && !logsLoaded) loadLogs();
  if (name === "prompt" && !promptsLoaded) { loadPrompts(); onDigestSrc(); }
  if (name === "batch" && !casesLoaded) loadCases();
}

// ---------------- 模型设置 ----------------
async function loadCfg() {
  try {
    const c = await api("/api/config");
    $("cfg-info").innerHTML = c.config_exists
      ? `模型 <b>${esc(c.model)}</b> · ${esc(c.base_url)} · key ${c.has_key ? '<span class="ok">已配置 '+esc(c.key_tail)+'</span>' : '<span class="bad">未配置</span>'}${c.thinking ? ' · thinking' : ''}`
      : `<span class="bad">llm_config.json 不存在</span>`;
    cfgCache = c;
  } catch (e) {
    $("cfg-info").innerHTML = `<span class="bad">配置加载失败：${esc(e.message)}</span>`;
  }
}
let cfgCache = null;
function openCfg() {
  const c = cfgCache || {};
  $("cfg-base").value = c.base_url || ""; $("cfg-model").value = c.model || "";
  $("cfg-key").value = ""; $("cfg-key").placeholder = c.has_key ? "当前：" + c.key_tail : "sk-…";
  $("cfg-thinking").checked = !!c.thinking;
  $("modal-mask").style.display = "flex";
}
function closeCfg() { $("modal-mask").style.display = "none"; }
async function saveCfg() {
  try {
    const r = await api("/api/config", "PUT", { base_url: $("cfg-base").value.trim(), model: $("cfg-model").value.trim(), api_key: $("cfg-key").value.trim(), thinking: $("cfg-thinking").checked });
    if (r.ok) { toast("配置已保存"); closeCfg(); loadCfg(); } else toast("保存失败：" + (r.error||""));
  } catch (e) { toast("保存失败：" + e.message); }
}

// ---------------- 日志查看 ----------------
let logsLoaded = false, logEntries = [], logSel = -1;
async function loadLogs() {
  const which = $("log-which").value, n = $("log-n").value;
  let r;
  try { r = await api(`/api/logs?which=${which}&n=${n}`); }
  catch (e) { $("log-list").innerHTML = `<tr><td colspan="4" class="bad">${esc(e.message)}</td></tr>`; return; }
  logEntries = r.lines || []; logSel = -1; logsLoaded = true;
  $("log-path").textContent = r.missing ? "文件不存在：" + r.path : r.path;
  const tb = $("log-list"); tb.innerHTML = "";
  logEntries.forEach((e, i) => {
    const tr = document.createElement("tr"); tr.className = "entry"; tr.onclick = () => showLog(i);
    let sum, ms = "", tok = "";
    if (e._bad) { sum = '<span class="bad">坏行</span>'; }
    else if (which === "llm") {
      const okll = e.error == null && (e.status === 200 || e.status == null);
      sum = `<span class="${e.error ? "bad" : "ok"}">${esc(e.phase||"")}${e.error ? " ✗" : " ✓"}</span> ${esc(e.model||"")}`;
      ms = e.ms != null ? e.ms + "ms" : "";
      tok = e.usage ? (e.usage.total_tokens ?? ((e.usage.prompt_tokens||0)+(e.usage.completion_tokens||0))) : "";
    } else {
      const rc = /executed|cache_hit/.test(e.result||"") ? "ok" : /fail|invalid|no-op/.test(e.result||"") ? "bad" : "warn";
      sum = `<span class="${rc}">${esc(e.text||"")}</span>`;
    }
    tr.innerHTML = `<td class="dim">${esc(e.wall||"")}</td><td>${sum}</td><td class="dim">${ms}</td><td class="dim">${tok}</td>`;
    tb.appendChild(tr);
  });
  $("log-detail").innerHTML = '<span class="dim">← 点击左侧条目查看完整现场</span>';
}
function section(title, content, isJson, open) {
  if (content == null || content === "") return "";
  const body = isJson ? esc(pretty(content)) : esc(content);
  return `<details ${open ? "open" : ""}><summary>${title}</summary><pre>${body}</pre></details>`;
}
function showLog(i) {
  logSel = i;
  document.querySelectorAll("#log-list tr").forEach((tr, j) => tr.classList.toggle("sel", j === i));
  const e = logEntries[i];
  let h = `<div class="row"><span class="pill">${esc(e.wall||"")}</span><span class="pill">t=${esc(e.t??"")}</span>`;
  if (e._bad) { $("log-detail").innerHTML = h + "</div>" + section("原始行", e.raw, false, true); return; }
  if (e.phase !== undefined || e.system !== undefined || e.request !== undefined) {   // llm_log（v1/v2 自适应）
    h += `<span class="pill">${esc(e.phase||"")}</span><span class="pill">${esc(e.model||"")}</span>`;
    if (e.status != null) h += `<span class="pill">HTTP ${e.status}</span>`;
    if (e.ms != null) h += `<span class="pill">${e.ms}ms</span>`;
    h += "</div>";
    if (e.error) h += `<pre style="border-color:#7a3535"><span class="bad">${esc(e.error)}</span></pre>`;
    if (e.usage) h += section("token 用量", e.usage, true, true);
    if (e.prompt_src) h += `<div class="dim" style="font-size:11px">prompt 来源：${esc(e.prompt_src)}</div>`;
    if (e.system != null) {
      h += section("① 发给模型 · system prompt", e.system, false, false);
      h += section("② 发给模型 · user prompt（含战场态势 digest）", e.user, false, true);
      h += section("③ 模型返回 · content（正文）", e.content, true, true);
      h += section("④ 模型返回 · reasoning（思考过程）", e.reasoning, false, false);
    } else if (e.request != null) {   // v1 旧格式：request 是整个请求体字符串
      const req = tryJson(e.request);
      if (req && req.messages) {
        for (const m of req.messages)
          h += section(`① 发给模型 · ${m.role}（v1 旧格式）`, m.content, false, m.role === "user");
      } else h += section("请求体（v1 旧格式，可能被截断）", e.request, false, false);
      const resp = tryJson(e.response);
      const msg = resp && resp.choices && resp.choices[0] && resp.choices[0].message;
      if (msg) {
        h += section("③ 模型返回 · content", msg.content, true, true);
        if (msg.reasoning_content) h += section("④ 模型返回 · reasoning", msg.reasoning_content, false, false);
      } else h += section("响应体（v1 旧格式，可能被截断）", e.response, false, false);
    }
    h += section("response_raw（出错现场）", e.response_raw, true, true);
  } else {   // command_log
    h += `<span class="pill">${esc(e.result||"")}</span></div>`;
    h += section("玩家原话", e.text, false, true);
    h += section("参谋回复", e.reply, false, true);
    h += section("执行明细 exec", e.exec, false, true);
    h += section("模型输出 JSON", e.model, true, true);
    h += section("当时战场态势 digest", e.digest, true, false);
    h += section("发给模型的请求体（v1 旧字段）", e.request, true, false);
    h += section("API 原始响应（v1 旧字段）", e.response, true, false);
  }
  $("log-detail").innerHTML = h;
}

// ---------------- Prompt 调试 ----------------
let promptsLoaded = false;
const PROMPT_FILES = ["system_prompt.txt", "user_template.txt", "examples.txt"];
async function loadPrompts() {
  const r = await api("/api/prompts");
  const box = $("prompt-editors"); box.innerHTML = "";
  PROMPT_FILES.forEach(name => {
    const f = r.files[name] || {};
    const div = document.createElement("div"); div.className = "editor-block";
    div.innerHTML = `<div class="lbl"><b>${name}</b><span class="dim">${f.exists ? "修改于 " + f.mtime : '<span class="bad">文件缺失（游戏将用内嵌默认）</span>'}</span>
      <button onclick="savePrompt('${name}')">保存</button></div>
      <textarea id="pe-${name}" rows="${name === "system_prompt.txt" ? 22 : 8}">${esc(f.content || "")}</textarea>`;
    box.appendChild(div);
  });
  promptsLoaded = true;
}
async function savePrompt(name) {
  try {
    const r = await api("/api/prompts/" + name, "PUT", { content: $("pe-" + name).value });
    toast(name + " 已保存 " + r.mtime);
  } catch (e) { toast("保存失败：" + e.message); }
}
async function saveAllPrompts() { for (const n of PROMPT_FILES) await savePrompt(n); }

async function onDigestSrc() {
  const src = $("digest-src").value, ta = $("digest-text");
  if (src === "custom") { ta.readOnly = false; if (!ta.value) ta.value = ""; return; }
  ta.readOnly = true; ta.value = "加载中…";
  try {
    if (src === "@sample") {
      const r = await api("/api/sample_digest");
      ta.value = r.digest ? pretty(r.digest) : ("加载失败：" + (r.error||""));
    } else {
      const r = await api("/api/logs?which=command&n=500");
      const hit = (r.lines||[]).slice().reverse().find(e => e.digest);
      ta.value = hit ? pretty(hit.digest) : "command_log 里没有可用 digest";
    }
  } catch (e) { ta.value = "加载失败：" + e.message; }
}
function digestPayload() { return $("digest-src").value === "custom" ? $("digest-text").value : $("digest-src").value; }

let lastRun = null;
async function runOnce() {
  const text = $("player-text").value.trim();
  if (!text) { toast("先输入玩家命令"); return; }
  $("btn-run").disabled = true;
  const box = $("run-result");
  const t0 = Date.now();
  box.innerHTML = '<span class="dim">调用中…</span>';
  const timer = setInterval(() => { if (box.dataset.pending) box.querySelector(".dim").textContent = `调用中…（已等待 ${((Date.now()-t0)/1000).toFixed(0)}s）`; }, 1000);
  box.dataset.pending = "1";
  try {
    const r = await api("/api/run", "POST", { player_text: text, digest: digestPayload(), history: $("history-text").value });
    lastRun = { name: "", player_text: text, digest: digestPayload(), history: $("history-text").value, note: "" };
    renderRunResult(box, r, true);
  } catch (e) {
    box.innerHTML = `<pre style="border-color:#7a3535"><span class="bad">✗ ${esc(e.message)}</span></pre>`;
  } finally {
    delete box.dataset.pending;
    clearInterval(timer);
    $("btn-run").disabled = false;
  }
}
function renderRunResult(box, r, showSave) {
  if (!r.ok && !r.content) {
    box.innerHTML = `<pre style="border-color:#7a3535"><span class="bad">✗ ${esc(r.error||"未知错误")}</span></pre>`
      + (r.response_raw ? section("response_raw", r.response_raw, true, false) : "")
      + (r.ms != null ? `<div class="dim">${r.ms}ms · HTTP ${r.status||0}</div>` : "");
    return;
  }
  const j = tryJson(r.content);
  const u = r.usage || {};
  let h = `<div class="row"><span class="ok">✓ ${r.ms}ms</span>
    <span class="pill">in ${u.prompt_tokens||"?"}</span><span class="pill">out ${u.completion_tokens||"?"}</span>
    ${u.completion_tokens_details && u.completion_tokens_details.reasoning_tokens ? `<span class="pill">reasoning ${u.completion_tokens_details.reasoning_tokens}</span>` : ""}
    <span class="${j ? "ok" : "bad"}">${j ? "JSON ✓" : "JSON ✗"}</span>
    ${j ? `<span class="pill">orders ${(j.orders||[]).length}</span><span class="pill">economy ${(j.economy||[]).length}</span>` : ""}
    ${showSave ? '<button onclick="saveAsCase()">存为样例</button>' : ""}</div>`;
  if (j && j.player_reply) h += `<pre style="border-color:#2f5a3d"><span class="ok">参谋：${esc(j.player_reply)}</span></pre>`;
  if (j && j.clarification_needed) h += `<pre><span class="warn">追问：${esc(j.question||"")}</span></pre>`;
  if (r.prompt_src) h += `<div class="dim" style="font-size:11px">prompt 来源：${esc(r.prompt_src)}</div>`;
  h += section("模型返回 content", r.content, true, true);
  h += section("模型思考 reasoning", r.reasoning, false, false);
  h += section("实际发送 · system prompt", r.system, false, false);
  h += section("实际发送 · user prompt", r.user, false, false);
  box.innerHTML = h;
}
async function saveAsCase() {
  if (!lastRun) return;
  const name = prompt("样例名称：", lastRun.player_text.slice(0, 12));
  if (name == null) return;
  const note = prompt("期望 / 备注（可空）：", "") || "";
  cases.push({ name, player_text: lastRun.player_text, digest: lastRun.digest, history: lastRun.history, note });
  await saveCases(); renderCases(); toast("已加入批跑样例");
}

// ---------------- 批跑样例 ----------------
let casesLoaded = false, cases = [], batchResults = [];
async function loadCases() {
  try {
    const r = await api("/api/cases");
    cases = r.cases || []; casesLoaded = true; renderCases();
  } catch (e) { toast("样例加载失败：" + e.message); }
}
function renderCases() {
  const tb = $("case-list"); tb.innerHTML = "";
  cases.forEach((c, i) => {
    const tr = document.createElement("tr");
    tr.innerHTML = `<td><input type="text" value="${esc(c.name||"")}" onchange="cases[${i}].name=this.value"></td>
      <td><input type="text" style="width:100%" value="${esc(c.player_text||"")}" onchange="cases[${i}].player_text=this.value"></td>
      <td><select onchange="cases[${i}].digest=this.value">
        <option value="@sample" ${c.digest==="@sample"?"selected":""}>示例样例</option>
        <option value="@command_log_latest" ${c.digest==="@command_log_latest"?"selected":""}>日志最新态势</option>
        <option value="custom" ${c.digest!=="@sample"&&c.digest!=="@command_log_latest"?"selected":""}>自定义（存字面量）</option>
      </select></td>
      <td><input type="text" style="width:100%" value="${esc(c.note||"")}" onchange="cases[${i}].note=this.value"></td>
      <td><button onclick="runOneCase(${i},this)">运行</button> <button class="danger" onclick="cases.splice(${i},1);renderCases()">删</button></td>`;
    tb.appendChild(tr);
  });
}
function addCase() { cases.push({ name: "新样例", player_text: "", digest: "@sample", history: "", note: "" }); renderCases(); }
async function saveCases() {
  try {
    const r = await api("/api/cases", "PUT", { cases });
    toast(r.ok ? `已保存 ${r.count} 条样例` : "保存失败：" + (r.error||""));
  } catch (e) { toast("保存失败：" + e.message); }
}

async function runOneCase(i, btn) {
  const c = cases[i];
  if (btn) btn.disabled = true;
  const r = await api("/api/run", "POST", { player_text: c.player_text, digest: c.digest || "@sample", history: c.history || "" });
  r._case = c;
  return r;
}
function summarize(r) {
  const j = tryJson(r.content);
  return { json_ok: !!j, orders: j ? (j.orders||[]).length : 0, economy: j ? (j.economy||[]).length : 0,
    reply: j ? (j.player_reply||"") : "", clarification: j ? !!j.clarification_needed : false };
}
async function runBatch() {
  if (!cases.length) { toast("没有样例"); return; }
  $("btn-batch").disabled = true; batchResults = [];
  const box = $("batch-results"); box.innerHTML = "";
  try {
    for (let i = 0; i < cases.length; i++) {
      $("batch-progress").textContent = `运行中 ${i+1}/${cases.length}：${cases[i].name}（单条约 5~20s，请稍候）`;
      let r;
      try { r = await runOneCase(i, null); }
      catch (e) { r = { ok: false, error: e.message || String(e), ms: 0 }; }
      batchResults.push(r);
      const s = summarize(r);
    const card = document.createElement("div");
    card.style.cssText = "border:1px solid #2c313a;border-radius:6px;padding:8px;margin-bottom:8px";
    const headCls = r.ok && s.json_ok ? "ok" : "bad";
    card.innerHTML = `<div class="row" style="margin-bottom:2px">
      <b class="${headCls}">${r.ok ? (s.json_ok ? "✓" : "✗ JSON非法") : "✗"}</b>
      <b>${esc(cases[i].name)}</b><span class="dim">${esc(cases[i].player_text)}</span>
      <span class="pill">${r.ms||0}ms</span>
      ${r.usage ? `<span class="pill">${r.usage.total_tokens||"?"} tok</span>` : ""}
      ${s.json_ok ? `<span class="pill">orders ${s.orders}</span><span class="pill">economy ${s.economy}</span>` : ""}
      </div>
      ${s.reply ? `<div class="ok" style="font-size:12px">参谋：${esc(s.reply)}</div>` : ""}
      ${s.clarification ? '<div class="warn" style="font-size:12px">（模型发起了追问）</div>' : ""}
      ${r.error ? `<div class="bad" style="font-size:12px">${esc(r.error)}</div>` : ""}
      ${cases[i].note ? `<div class="dim" style="font-size:11px">期望：${esc(cases[i].note)}</div>` : ""}
      <div class="detail-box"></div>`;
    const detailBox = card.querySelector(".detail-box");
    const det = document.createElement("details");
    det.innerHTML = "<summary>展开完整返回</summary><div class='inner'></div>";
    card.appendChild(det);
    det.addEventListener("toggle", () => { if (det.open && !det.dataset.done) { det.dataset.done = 1; renderRunResult(det.querySelector(".inner"), r, false); } });
    card.removeChild(detailBox);
    box.appendChild(card);
    }
  } finally {
    $("batch-progress").textContent = `完成 ${batchResults.length} 条`;
    $("btn-batch").disabled = false;
  }
}
function exportResults() {
  if (!batchResults.length) { toast("先运行批跑"); return; }
  const lines = batchResults.map(r => JSON.stringify({
    wall: new Date().toISOString(), name: r._case ? r._case.name : "", player_text: r._case ? r._case.player_text : "",
    note: r._case ? r._case.note : "", ok: r.ok, ms: r.ms, usage: r.usage || null,
    content: r.content || null, reasoning: r.reasoning || null, error: r.error || null,
  }));
  const blob = new Blob([lines.join("\n")], { type: "application/jsonl" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "batch_results_" + new Date().toISOString().slice(0,19).replace(/[:T]/g,"-") + ".jsonl";
  a.click();
}

loadLogs();
